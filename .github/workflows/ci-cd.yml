name: CI/CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name and tag
        shell: powershell
        run: |
          "IMAGE_NAME=ghcr.io/${{ github.repository }}" >> $env:GITHUB_ENV
          "IMAGE_TAG=sha-${{ github.sha }}" >> $env:GITHUB_ENV

      - name: Build Docker image
        shell: powershell
        run: |
          docker build `
            -t "${env:IMAGE_NAME}:${env:IMAGE_TAG}" `
            -t "${env:IMAGE_NAME}:latest" `
            .

      - name: Push Docker image
        shell: powershell
        run: |
          docker push "${env:IMAGE_NAME}:${env:IMAGE_TAG}"
          docker push "${env:IMAGE_NAME}:latest"

      - name: Save Docker image
        shell: powershell
        run: |
          docker save "${env:IMAGE_NAME}:${env:IMAGE_TAG}" `
            -o "${{ github.workspace }}\my-portfolio-${env:IMAGE_TAG}.tar"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "release-${{ github.sha }}"
          name: "Release ${{ github.sha }}"
          generate_release_notes: true
          files: |
            ${{ github.workspace }}\my-portfolio-${{ env.IMAGE_TAG }}.tar
